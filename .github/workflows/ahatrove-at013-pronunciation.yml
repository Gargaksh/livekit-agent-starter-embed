name: AhaTrove AT013 Indigenous-name voice repair A-B-C (draft only)
on:
  push:
    branches: [ahatrove-at013-root-bridges-film-20261123]
    paths: [.github/workflows/ahatrove-at013-pronunciation.yml]
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    permissions:
      contents: read
    env:
      HF_HUB_DISABLE_TELEMETRY: '1'
      TORCH_NUM_THREADS: '2'
      OMP_NUM_THREADS: '2'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install same open Chatterbox voice and transcription model
        run: |
          python -m pip install --no-cache-dir 'torch==2.6.0' 'torchaudio==2.6.0' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --no-cache-dir 'chatterbox-tts' 'faster-whisper==1.2.1'
      - name: Independently generate and transcribe three alternative proper-name phrasings
        run: |
          python - <<'PY'
          from pathlib import Path
          import torch,torchaudio,json,re
          from difflib import SequenceMatcher
          from chatterbox.tts import ChatterboxTTS
          from faster_whisper import WhisperModel
          out=Path('AT013_NAME_REPAIR');out.mkdir(exist_ok=True)
          torch.set_num_threads(2);torch.manual_seed(17131125)
          voice=ChatterboxTTS.from_pretrained(device='cpu')
          options=[
            'In Meghalaya, the Khasi people have a remarkable answer.',
            'In Meghalaya, communities in the Khasi Hills have a remarkable answer.',
            'In the Khasi Hills of Meghalaya, people have a remarkable answer.',
          ]
          rows=[]
          for i,text in enumerate(options):
            with torch.no_grad(): wav=voice.generate(text,exaggeration=0.58,cfg_weight=0.48)
            file=out/f'AT013_SEG02_VARIANT_{i+1:02}.wav'
            torchaudio.save(file,wav,voice.sr)
            rows.append(dict(variant=i+1,file=file.name,text=text,duration_s=round(wav.shape[-1]/voice.sr,3)))
          asr=WhisperModel('base.en',device='cpu',compute_type='int8',cpu_threads=2)
          for row in rows:
            parts,_=asr.transcribe(str(out/row['file']),beam_size=5,vad_filter=False)
            heard=' '.join(p.text for p in parts).strip()
            norm=lambda x:re.sub('[^a-z0-9 ]','',x.lower())
            score=SequenceMatcher(None,norm(row['text']),norm(heard)).ratio()
            row.update(asr_heard=heard,similarity=round(score,3),khasi_detected='khasi' in heard.lower(),meghalaya_detected='meghalaya' in heard.lower())
            print('PROPER_NAME_VARIANT',row,flush=True)
          (out/'AT013_VARIANT_ASR_COMPARISON.json').write_text(json.dumps(rows,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AT013-NamePronunciation-Natural-Voice-Alternatives
          path: AT013_NAME_REPAIR/
          retention-days: 2
          if-no-files-found: warn
