name: Temporary recovery of original AhaTrove narrator audition
on:
  push:
    branches: [ahat-nm-audio-recovery-20261124]
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Fetch audio from public temporary demo output
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 3 --connect-timeout 20 --max-time 120 -L --fail --show-error -o kokoro_narration.wav 'https://hexgrad-kokoro-tts.hf.space/gradio_api/file=/tmp/gradio/c72ed654b5b387ff6b85384195789294a7443e91db5f0555aac1c842476767a6/audio.wav'
          test -s kokoro_narration.wav
          python - <<'PY'
          import wave, hashlib
          with wave.open('kokoro_narration.wav','rb') as w:
              print('SECONDS',w.getnframes()/w.getframerate(),'channels',w.getnchannels(),'rate',w.getframerate())
          print('SHA256',hashlib.sha256(open('kokoro_narration.wav','rb').read()).hexdigest())
          PY
      - name: Independent ASR check for truncated text
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet faster-whisper==1.2.0
          python - <<'PY'
          from faster_whisper import WhisperModel
          from pathlib import Path
          import json,hashlib,wave,numpy as np
          m=WhisperModel('tiny.en',device='cpu',compute_type='int8',cpu_threads=2)
          with wave.open('kokoro_narration.wav','rb') as wf:
            sr=wf.getframerate()
            raw=wf.readframes(wf.getnframes())
          x=np.frombuffer(raw,dtype=np.int16).astype(np.float32)/32768.0
          src=np.arange(len(x))
          dst=np.arange(int(len(x)*16000/sr))*sr/16000
          x16=np.interp(dst,src,x).astype(np.float32)
          segs,meta=m.transcribe(x16,beam_size=2,vad_filter=False,word_timestamps=True)
          arr=list(segs)
          words=[{'start':round(w.start,3),'end':round(w.end,3),'word':w.word} for seg in arr for w in (seg.words or [])]
          txt=' '.join(seg.text.strip() for seg in arr)
          Path('narration_asr.txt').write_text(txt+'\n')
          Path('narration_words.json').write_text(json.dumps(words,indent=2))
          print('ASR_WORD_COUNT',len(words),'ASR_LAST_END',words[-1]['end'] if words else 0,flush=True)
          print('ASR_TEXT_SHA',hashlib.sha256(txt.encode()).hexdigest(),flush=True)
          PY
      - name: Preserve user-requested review audio
        uses: actions/upload-artifact@v4
        with:
          name: AhaTrove-NM001-Kokoro-Audio-Review
          path: |
            kokoro_narration.wav
            narration_asr.txt
            narration_words.json
          retention-days: 1
