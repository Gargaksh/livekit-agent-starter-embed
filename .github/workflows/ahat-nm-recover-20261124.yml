name: Temporary recovery of original AhaTrove narrator audition
on:
  push:
    branches: [ahat-nm-audio-recovery-20261124]
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Fetch both original narrator halves from temporary demo output
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 3 --connect-timeout 20 --max-time 120 -Lf --show-error -o part1.wav 'https://hexgrad-kokoro-tts.hf.space/gradio_api/file=/tmp/gradio/02e6b3e083a628eb09a0e301d2913d7e4730858f3aaf95269261795078967bc8/audio.wav'
          curl --retry 3 --connect-timeout 20 --max-time 120 -Lf --show-error -o part2.wav 'https://hexgrad-kokoro-tts.hf.space/gradio_api/file=/tmp/gradio/c3930797f872a92e5958737f271d3f2d1bb95e855ca0dec19a0e40c4c0e8ef5e/audio.wav'
          test -s part1.wav
          test -s part2.wav
          python - <<'PY'
          import wave, hashlib
          for f in ['part1.wav','part2.wav']:
            with wave.open(f,'rb') as w:
              print('FILE',f,'SECONDS',w.getnframes()/w.getframerate(),'channels',w.getnchannels(),'rate',w.getframerate())
          PY
      - name: Independent ASR check for truncated text
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet faster-whisper==1.2.0
          python - <<'PY'
          from faster_whisper import WhisperModel
          from pathlib import Path
          import json,hashlib,wave,numpy as np
          m=WhisperModel('tiny.en',device='cpu',compute_type='int8',cpu_threads=2)
          for f in ['part1.wav','part2.wav']:
            with wave.open(f,'rb') as wf:
              sr=wf.getframerate()
              raw=wf.readframes(wf.getnframes())
            x=np.frombuffer(raw,dtype=np.int16).astype(np.float32)/32768.0
            src=np.arange(len(x))
            dst=np.arange(int(len(x)*16000/sr))*sr/16000
            x16=np.interp(dst,src,x).astype(np.float32)
            segs,meta=m.transcribe(x16,beam_size=2,vad_filter=False,word_timestamps=True)
            arr=list(segs)
            words=[{'start':round(w.start,3),'end':round(w.end,3),'word':w.word} for seg in arr for w in (seg.words or [])]
            txt=' '.join(seg.text.strip() for seg in arr)
            Path(f+'_asr.txt').write_text(txt+'\n')
            Path(f+'_words.json').write_text(json.dumps(words,indent=2))
            print('ASR',f,'WORD_COUNT',len(words),'LAST_END',words[-1]['end'] if words else 0,flush=True)
            print('ASR_TEXT_SHA',hashlib.sha256(txt.encode()).hexdigest(),flush=True)
          PY
      - name: Preserve user-requested review audio
        uses: actions/upload-artifact@v4
        with:
          name: AhaTrove-NM001-Kokoro-Audio-Review
          path: |
            narration_asr.txt
            narration_words.json
            part1.wav
            part2.wav
            part1.wav_asr.txt
            part2.wav_asr.txt
            part1.wav_words.json
            part2.wav_words.json
          retention-days: 1
