name: AhaTrove AT008 independent ASR and timing audit (free public runner)
on:
  push:
    branches: [ahatrove-at008-voice-20261123]
    paths:
      - .github/workflows/ahatrove-at008-asr-review.yml
jobs:
  audit-audio:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      actions: read
      contents: read
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
      OMP_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download same-run A/B audio evidence, do not rerun TTS
        uses: actions/download-artifact@v4
        with:
          name: AT008-Kokoro-Voice-AB-REVIEW-ONLY
          run-id: 45099684753
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: at008_kokoro_review_only
      - name: Install open-source speech recognition
        run: python -m pip install --no-cache-dir 'faster-whisper==1.2.1'
      - name: Independently transcribe both and estimate spoken-word times
        run: |
          python production/ahatrove/at008_independent_asr.py
          test -s at008_kokoro_review_only/INDEPENDENT_ASR_WORD_TIMINGS.json
      - name: Store independent timing transcript for review only
        uses: actions/upload-artifact@v4
        with:
          name: AT008-Kokoro-Independent-ASR-REVIEW-ONLY
          path: at008_kokoro_review_only/INDEPENDENT_ASR_WORD_TIMINGS.json
          retention-days: 1
          if-no-files-found: error
