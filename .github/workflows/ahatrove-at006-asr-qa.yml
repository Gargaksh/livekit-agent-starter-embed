name: AT006 original narration automatic ASR QC, no paid provider
on:
  push:
    branches: [ahatrove-at006-voice-audition-20261123]
  workflow_dispatch:
jobs:
  asr:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download original audition WAV from exact prior artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/14774306565/zip" -o voice.zip
          unzip -oq voice.zip
          test -s AT006_NEURAL_VOICE_AUDITION_ONLY.wav
          test -s AT006_EXACT_SCRIPT.txt
      - name: Install local model (no API) for unbiased English ASR
        run: |
          python -m pip install --no-cache-dir 'faster-whisper==1.2.1'
      - name: Word timestamps, independent transcript and WER
        env:
          HF_HUB_DISABLE_TELEMETRY: '1'
          OMP_NUM_THREADS: '2'
        run: |
          python - <<'PY'
          from faster_whisper import WhisperModel
          from pathlib import Path
          import json, re, hashlib, time
          p=Path('AT006_NEURAL_VOICE_AUDITION_ONLY.wav')
          exact=Path('AT006_EXACT_SCRIPT.txt').read_text()
          t=time.time()
          model=WhisperModel('small.en',device='cpu',compute_type='int8',cpu_threads=2,num_workers=1)
          segs,info=model.transcribe(str(p),language='en',beam_size=4,best_of=4,word_timestamps=True,vad_filter=False)
          segs=list(segs)
          transcript=' '.join(s.text.strip() for s in segs).strip()
          words=[{'word':w.word.strip(),'start':round(w.start,3),'end':round(w.end,3),'probability':round(w.probability,3)} for s in segs for w in (s.words or [])]
          norm=lambda s:re.findall(r"[a-z]+(?:'[a-z]+)?",s.lower().replace('—',' '))
          a=norm(exact);b=norm(transcript)
          prev=list(range(len(b)+1))
          for i,xx in enumerate(a,1):
           cur=[i]+[0]*len(b)
           for j,yy in enumerate(b,1):cur[j]=min(cur[j-1]+1,prev[j]+1,prev[j-1]+(xx!=yy))
           prev=cur
          distance=prev[-1]
          report={'film_id':'AT-006','asr_model':'faster-whisper small.en','audio_sha256':hashlib.sha256(p.read_bytes()).hexdigest(),'script_word_count':len(a),'asr_word_count':len(b),'word_error_distance':distance,'wer':round(distance/len(a),4),'exact_script':exact,'asr_transcript':transcript,'words':words,'duration_detected_s':round(max([x['end'] for x in words] or [0]),3),'decode_seconds':round(time.time()-t,2),'status':'AUTOMATED MACHINE AUDIT ONLY: not subjective voice QA; ASR can misrecognize correctly spoken speech, and may miss mispronunciations'}
          Path('AT006_WORDS_ASR_UNVERIFIED.json').write_text(json.dumps(report,ensure_ascii=False,indent=2))
          Path('AT006_ASR_transcript.txt').write_text(transcript+'\n')
          print(json.dumps({k:v for k,v in report.items() if k not in ['words','exact_script','asr_transcript']},indent=2))
          print('ASR:',transcript,flush=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: AT006-original-voice-ASR-QA-NOT-APPROVED
          path: |
            AT006_WORDS_ASR_UNVERIFIED.json
            AT006_ASR_transcript.txt
          retention-days: 2
