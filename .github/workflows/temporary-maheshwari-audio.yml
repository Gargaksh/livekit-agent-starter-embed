name: Temporary Maheshwari production asset recovery
on:
  push:
    branches: [temporary-maheshwari-voice-20261122]
jobs:
  retrieve-assets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Retrieve prior authorized generated media
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p media
          curl --fail -L --retry 3 'https://assets.vidiq.com/voiceovers/b3392d06-cfd5-457e-8428-599e9df114cf/081d7dd5-4527-4cf6-b670-47cf6e821538.mp3' -o media/narration.mp3
          curl --fail -L --retry 3 'https://ai-music-tracks.s3.us-east-1.amazonaws.com/b3392d06-cfd5-457e-8428-599e9df114cf/2734f133-e512-4c81-a396-62143b828b34.mp3' -o media/music.mp3
          curl --fail -L --retry 3 'https://ai-thumbnails.s3.amazonaws.com/editor/b3392d06-cfd5-457e-8428-599e9df114cf/1a59908e-6f49-41e6-9819-4cb580621fc4.jpeg' -o media/prince.jpeg
          curl --fail -L --retry 3 'https://ai-thumbnails.s3.amazonaws.com/editor/b3392d06-cfd5-457e-8428-599e9df114cf/71746fd3-1be5-461f-9242-02addbebce62.jpeg' -o media/curse.jpeg
          curl --fail -L --retry 3 'https://ai-thumbnails.s3.amazonaws.com/editor/b3392d06-cfd5-457e-8428-599e9df114cf/891854d8-6895-4444-bfb1-606d91a574c9.jpeg' -o media/shiva.jpeg
          test "$(wc -c < media/narration.mp3)" -gt 100000
          find media -type f -exec file {} \;
      - uses: actions/upload-artifact@v4
        with:
          name: maheshwari-production-media
          path: media/
          retention-days: 1
